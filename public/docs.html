<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteX API Reference & Interactive Console</title>
  <meta name="description" content="Interactive OpenAPI documentation and live edge testing console for RouteX Stateless Web Gateway.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      color: #e6edf3;
      font-size: 14px;
    }
    .top-banner a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 500;
      margin-left: 14px;
    }
    .top-banner a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-banner">
    <div>
      <strong>⚡ RouteX</strong> &bull; Interactive OpenAPI 3.1 Reference
    </div>
    <div>
      <a href="/">Dashboard</a>
      <a href="/api">Catalog</a>
      <a href="/openapi.json" target="_blank">openapi.json</a>
      <a href="https://github.com/jojin1709/RouteX" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <script
    id="api-reference"
    data-url="/openapi.json"
    data-configuration='{"theme":"purple","darkMode":true,"layout":"modern","hideModels":false}'>
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
